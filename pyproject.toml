[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-analytics"
version = "0.1.0"
description = "Python client for the public NHL API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["nhl_analytics*"]
